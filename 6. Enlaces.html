<!-- Define que es una pagina web -->
<!DOCTYPE html>

<!-- Hace que el idioma principal de la pagina sea el ingles -->
<html lang="es">

<!-- Configuración para la pagina -->
<head>
    <!-- Permite utilizar caracteres especiales -->
    <meta charset="UTF-8">

    <!-- Ajusta el tamaño de la pagina para telefonos -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Es el titulo de la pestaña -->
    <title>Enlaces en HTML</title>
</head>
<!-- Se cierra la configuracion para la pagina -->

<!-- Inicia el cuerpo principal de la pagina -->
<body>

    <!-- Subtítulo que indica el tema de la pagina -->
    <h2>Tipos de enlaces en HTML</h2>

    <!-- Texto que habla sobre los enlaces internos del mismo sitio -->
    <!-- En este mismo se resalta la categoría utilizando "<strong>" -->
    <p><strong>Enlaces/Hipervinculos a otra pagina del mismo sitio.</strong></p>

    <!-- Enlaces locales que redirigen a archivos HTML internos del proyecto -->
    <!-- Se muestra el uso del atributo target (_self, _blank, _parent, _top) -->
    <a href="1. Hola_mundo.html">1. Hola Mundo</a><br>
    <a href="2. Encabezados.html" target="_self">2. Encabezados</a><br> <!-- Abre en la misma pestaña -->
    <a href="3. Parrafos.html" target="_blank">3. Parrafos</a><br> <!-- Abre en una nueva pestaña -->
    <a href="4. Salto de linea.html" target="_parent">4. Salto de linea</a><br> <!-- Abre en el marco padre -->
    <a href="5. Enfatizado.html" target="_top">5. Enfatizado</a><br> <!-- Abre en el cuerpo completo de la ventana -->
    <!-- Se cierra la parte de los enlaces internos -->

    <!-- Texto que habla sobre los enlaces a sitios web externos -->
    <!-- En este mismo se resalta la categoría utilizando "<strong>" -->
    <p><strong>Enlaces/Hipervinculos a sitios externos</strong></p>

    <!-- Enlaces con direcciones URL completas que redirigen fuera del sitio -->
    <a href="https://www.google.com/">Google</a><br>
    <a href="https://www.youtube.com/" target="_self">YouTube</a><br>
    <a href="https://www.facebook.com/" target="_blank">FaceBook</a><br>
    <a href="https://www.wikipedia.com/" target="_parent">WikiPedia</a><br>
    <a href="https://www.espanol.yahoo.com/" target="_top">Yahoo!</a><br>
    <!-- Se cierra la parte de los enlaces externos -->

</body>
<!-- Se cierra el cuerpo principal de la pagina -->
</html>
<!-- Fin de la pagina HTML -->
