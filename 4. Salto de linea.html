<!-- Define que es una pagina web -->
<!DOCTYPE html>
<!-- Hace que el idioma principal de a pagina sea el español  -->
<html lang="en">
   
    <!-- Configuración para la pagina -->
<head>
    <!-- Permite utilizar caracteres especiales -->
    <meta charset="UTF-8">
    <!-- Ajusta el tamaño de la pagina para telefonos  -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Es el titulo de la pestaña  -->
    <title>Salto de linea en HTML</title>
</head>    
<!-- Se cierra la configuracion para la pagina -->

<!-- Inicia el cuerpo principal de la pagina  -->
<body>
    <!-- Título de la pagina -->
    <h1>Lenguaje de programacion</h1>

    <!-- Inicia el texto que da la introduccion a los lenguajes de programacion-->
    <p>En la actualidad se utilizan diferentes
        lenguajes de programacion tanto para desarrollo
        web, desarrollo movil, entranamiento de inteligencia
        artificial, pero de los mas usados son
        los siguientes:<br>
        <!-- Se utiliza un salto de linea para darle fin a la introducion -->
        
        <!-- Lista de lenguajes mas utilizados acompañados con un salto de linea-->
        Dart<br>
        Flutter<br>
        Python<br>
        Ruby<br>
        Java<br>
        TypeScript<br>
        Entre otros.
    </p>
    <!-- se cierra todo el texto de la introduccion y la lista de los lenguajes -->
</body>
<!-- Se cierra el cuerpo principal de la pagina -->

</html>
<!-- Fin de la pagina HTML -->
